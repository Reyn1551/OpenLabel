# Static host for the built single-page app.
#
# OpenLabel has no backend: nginx serves the hashed build output and never
# proxies user data. The content security policy has to allow WebAssembly
# ('wasm-unsafe-eval') and blob URLs (worker + image previews), and nothing else.
#
# Cache-Control is set from one map instead of per-location `add_header`, because
# a nested `add_header` would drop every security header inherited from `server`.

map $uri $openlabel_cache {
  default                              "no-cache";
  ~^/assets/                           "public, max-age=31536000, immutable";
  ~^/(icons|logo-[a-z]+\.svg|og\.png)  "public, max-age=604800";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  add_header Cache-Control $openlabel_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /assets/ {
    try_files $uri =404;
  }

  # Unknown paths are client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}